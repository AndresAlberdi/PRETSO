    - id: CKV_GHA_7
      herramienta: checkov
      justificacion: >-
        Regla SLSA sobre workflow_dispatch con inputs, en cuatro workflows de PRETSO (revisado el 2026-10-02 sobre release.yml, ci-node-firebase.yml, probar-identidad.yml y probar-rollback-staging.yml; codeql.yml y scorecard.yml tienen workflow_dispatch sin inputs): ningún input se interpola en un script. (1) release.yml declara `tipo`, un choice de [auto, patch, minor, major], y `prerelease`, un boolean: GitHub rechaza cualquier otro valor antes de que arranque; `tipo` llega al shell por variable de entorno (TIPO_ENTRADA) y `prerelease` solo se usa en expresiones (`if:` y `with:`). (2) ci-node-firebase.yml declara `tag` y `confirmar`, de texto: `confirmar` solo se compara con la cadena DESPLEGAR en el `if:` de desplegar-produccion y no llega a ningún script; `tag` llega a actions/checkout (`ref:`), al input `ref` del reusable de seguridad (que también lo usa solo como `ref:` de checkout) y a la variable de entorno TAG, que el shell usa entre comillas; antes de desplegar a producción el paso «Verificar aprobación» exige que sea un tag existente (refs/tags/), sin guion (descarta los prerelease y cualquier valor que empiece por -), ancestro de origin/main y lanzado por alguien de APROBADORES_PROD, y el job sigue sujeto al Environment production con revisores. (3) probar-identidad.yml declara `ambiente`, un choice de [staging, production], que solo se usa en expresiones (concurrency, environment y la elección de secretos y variables, que llegan al shell por variables de entorno). (4) probar-rollback-staging.yml declara `confirmar`, de texto, que solo se compara con ROLLBACK-STAGING en una expresión de `env:`; al shell llega únicamente el booleano resultante. El Environment staging no tiene revisores ni política de ramas: la barrera es el permiso de escritura en el repositorio y la confirmación escrita. Solo quien tiene permiso de escritura lanza un workflow_dispatch. Quitar los inputs obligaría a editar el workflow en cada release, despliegue manual, prueba de identidad o ensayo de rollback. Matices aceptados por el propietario: con `tag`, los jobs previos a la verificación (preparar, calidad, construir, seguridad-estatica) ejecutan código de la referencia indicada sin secretos de despliegue, el mismo riesgo que empujar una rama; el Environment production tiene un único revisor, que es también el aprobador; la excepción aplica a los cuatro workflows y se revisa antes de su vencimiento.
      aprobado_por: AndresAlberdi
      creado: "2026-10-01"
      vence: "2026-12-29"
