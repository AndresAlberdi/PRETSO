# Manifiesto del estándar DevSecOps v2.0 — proyecto PRETSO
# Esquema: .github/devsecops.schema.json
# Validar con: check-jsonschema --schemafile .github/devsecops.schema.json .devsecops.yml
#
# El proyecto Firebase existente (pretso-database) es STAGING. El proyecto de
# producción, pretso-prod, se creó el 2026-09-25 con su propia federación WIF,
# su base de Firestore y su Environment `production` con revisores; su secreto
# GCP_SA_DEPLOY_PROD vive en ese Environment, no en el repositorio.
#
# PENDIENTE antes del primer tag: migrar los datos de Firestore y los usuarios
# de autenticación desde pretso-database, y emitir y restringir la apiKey web
# de producción. Hasta que eso ocurra, pretso-prod está vacío: un despliegue
# publicaría la aplicación sin corpus. Lo impide la aprobación del Environment.
version: 1
proyecto: pretso
modo: A
cobertura_minima: 0   # subir a 70 al instalar @vitest/coverage-v8 (ver PILOTO.md, paso 6)
componentes:
  - nombre: web
    ruta: ./
    stack: node
    proveedor: firebase
    ambientes:
      staging:
        proyecto: pretso-database
        url: https://pretso-database.web.app
      production:
        proyecto: pretso-prod
        url: https://pretso-prod.web.app
seguridad:
  dast: true
  zap_reglas: .github/zap-rules.tsv
  bloquear_en: [CRITICAL, HIGH]
  excepciones: []
