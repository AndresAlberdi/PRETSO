# =============================================================================
# ci-node-firebase.yml — Pipeline completo SPA Node/React (Vite/Vitest)
#                        → Firebase Hosting + reglas de Firestore
# Versión: 2.9 | Fecha: 2026-10-01
# Adaptación PRETSO (conservar en cada actualización del estándar):
#   - test:rules con Java 21 explícito (firebase-tools 15 lo exige).
#   - Pines aprobados vía Dependabot por encima de la tabla del estándar:
#     actions/download-artifact v8.0.1 y actions/github-script v9.0.0.
#   - calidad: paso «Pruebas de lógica de los workflows» (tests/workflows,
#     unittest con el python3 del runner; ensayo 10 de OPS-06, 2026-10-02).
# -----------------------------------------------------------------------------
# Flujo (ver 00-gobernanza/02-flujo-git-y-versionado.md):
#   PR → main ............ preparar, calidad, seguridad-estatica, construir
#   push main ............ + desplegar-staging → dast-y-humo
#   push tag v* .......... + desplegar-produccion (Environment production)
#                            (health check y rollback incluidos) → post-despliegue (registro)
#   workflow_dispatch .... Modo B0: producción manual con confirmar=DESPLEGAR, lanzado sobre el tag (--ref vX.Y.Z)
#
# Identidad: Workload Identity Federation (sin JSON de service account).
# FirebaseExtended/action-hosting-deploy NO se usa porque solo acepta JSON de
# SA; en su lugar google-github-actions/auth (impersonación) + firebase-tools
# fijado, que soporta ADC (external_account) desde 15.x.
#
# Secretos: GCP_WIF_PROVIDER, GCP_SA_DEPLOY_STAGING, GCP_SA_DEPLOY_PROD
#           (+ GITLEAKS_LICENSE / SNYK_TOKEN opcionales, heredados)
# Variables: MODO, APROBADORES_PROD, TAG_FIRMADO_REQUERIDO, GCP_PROJECT_ID_STAGING,
#            GCP_PROJECT_ID_PROD, STAGING_URL, PROD_URL, HEALTH_PATH,
#            NODE_VERSION (22), COVERAGE_MIN (70), GHAS_ENABLED, BLOQUEAR_EN,
#            FIREBASE_DEPLOY_ONLY ('hosting,firestore:rules'),
#            FIREBASE_SITE_ID, FIREBASE_PREVIEW ('true' para canales de PR)
# =============================================================================
name: CI/CD Node → Firebase

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag vX.Y.Z ya creado (debe ser ancestro de main)
        type: string
        required: true
      confirmar:
        description: Escriba DESPLEGAR para publicar en producción desde el tag
        type: string
        required: true

# Mínimo global; cada job eleva lo que necesita.
permissions:
  contents: read

# Un solo run activo por rama/tag. En producción NO se cancela un despliegue
# en curso (concurrency propia en el job).
concurrency:
  # Un PR cancela su corrida anterior (misma ref); cualquier otra corrida (push a main,
  # tag, workflow_dispatch) tiene su grupo único y nunca se cancela. Es `github.run_id`
  # y NO `github.sha`: con sha, el push de un tag vX.Y.Z y un workflow_dispatch sobre
  # ese mismo commit compartirían grupo y la segunda corrida cancelaría la corrida
  # ENTERA de la primera, incluido un despliegue a producción en curso (la concurrency
  # propia del job, deploy-production, no lo evita: protege al job de otros jobs, no de
  # que cancelen su corrida). Lo señaló la sesión de novuchat-site el 2026-10-01.
  # La condición va en `group` y NO en
  # `cancel-in-progress`: Checkov descarta en silencio, sin error ni aviso, todo
  # workflow cuyo `cancel-in-progress` sea una expresión (medido el 2026-10-01 con
  # checkov 3.3.13), y el job `iac` pasaba en verde sin analizarlo.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  NODE_VERSION: ${{ vars.NODE_VERSION || '22' }}
  # firebase-tools fijado: verificar en npm antes de subir de versión (hubo una
  # regresión de ADC en 15.22.2, jun-2026).
  FIREBASE_TOOLS_VERSION: '15.28.1'

jobs:
  # ---------------------------------------------------------------------------
  # Fase 0 — preparar: detecta el gestor de paquetes y calienta la caché.
  # ---------------------------------------------------------------------------
  preparar:
    name: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pm: ${{ steps.pm.outputs.pm }}
      instalar: ${{ steps.pm.outputs.instalar }}
      # true si package.json define el script test:rules (pruebas de Firestore)
      hay_test_rules: ${{ steps.pm.outputs.hay_test_rules }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # En workflow_dispatch se analiza/despliega el tag aprobado (D3)
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Detectar gestor de paquetes
        id: pm
        run: |
          set -euo pipefail
          if   [[ -f pnpm-lock.yaml ]]; then pm=pnpm; instalar="pnpm install --frozen-lockfile"
          elif [[ -f yarn.lock ]];      then pm=yarn; instalar="yarn install --immutable"
          else                                pm=npm;  instalar="npm ci"; fi
          hay_test_rules=$(jq -r 'if .scripts["test:rules"] then "true" else "false" end' package.json)
          {
            echo "pm=$pm"; echo "instalar=$instalar"; echo "hay_test_rules=$hay_test_rules"
          } >> "$GITHUB_OUTPUT"
          echo "Gestor: $pm | test:rules: $hay_test_rules"

      - name: Habilitar corepack (pnpm/yarn)
        if: steps.pm.outputs.pm != 'npm'
        run: corepack enable

      - name: Node.js con caché
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ steps.pm.outputs.pm }}

      - name: Instalar dependencias (calienta la caché para los demás jobs)
        run: ${{ steps.pm.outputs.instalar }}

  # ---------------------------------------------------------------------------
  # Fase 1 — calidad: lint + pruebas con cobertura mínima + reglas Firestore.
  # ---------------------------------------------------------------------------
  calidad:
    name: calidad
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COVERAGE_MIN: ${{ vars.COVERAGE_MIN || 70 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # En workflow_dispatch se analiza/despliega el tag aprobado (D3)
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Habilitar corepack
        if: needs.preparar.outputs.pm != 'npm'
        run: corepack enable

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ needs.preparar.outputs.pm }}

      - name: Instalar dependencias
        run: ${{ needs.preparar.outputs.instalar }}

      - name: Lint
        run: npm run lint --if-present

      - name: Verificación de tipos (si existe el script)
        run: npm run typecheck --if-present

      - name: Pruebas unitarias con cobertura (Vitest)
        # json-summary es lo que lee el umbral; text es para el log.
        run: >-
          npm test --
          --run --coverage
          --coverage.reporter=text --coverage.reporter=json-summary

      - name: Umbral de cobertura (COVERAGE_MIN=${{ env.COVERAGE_MIN }} %)
        run: |
          set -euo pipefail
          archivo=coverage/coverage-summary.json
          if [[ ! -f "$archivo" ]]; then
            echo "::error::No existe $archivo. Habilite coverage en vitest.config (provider v8/istanbul)."
            exit 1
          fi
          lineas=$(jq -r '.total.lines.pct' "$archivo")
          echo "Cobertura de líneas: $lineas % (mínimo $COVERAGE_MIN %)"
          echo "### Cobertura: $lineas % (mínimo $COVERAGE_MIN %)" >> "$GITHUB_STEP_SUMMARY"
          if (( $(echo "$lineas < $COVERAGE_MIN" | bc -l) )); then
            echo "::error::Cobertura $lineas % por debajo del mínimo $COVERAGE_MIN %"
            exit 1
          fi

      - name: Pruebas de reglas de Firestore (emulador)
        if: needs.preparar.outputs.hay_test_rules == 'true'
        # El emulador necesita Java; firebase-tools 15 exige Java 21 o superior.
        # No se depende del Java por defecto del runner: si la imagen expone
        # JDK 21 (JAVA_HOME_21_X64), se usa explícitamente.
        run: |
          set -euo pipefail
          if [[ -n "${JAVA_HOME_21_X64:-}" ]]; then export JAVA_HOME="$JAVA_HOME_21_X64" PATH="$JAVA_HOME_21_X64/bin:$PATH"; fi
          java -version
          npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} \
            emulators:exec --only firestore --project demo-pruebas \
            "npm run test:rules"

      - name: Pruebas de lógica de los workflows (Python, sin red)
        # tests/workflows ejecuta el `run:` real de pasos de este pipeline con
        # dobles de curl/firebase/gcloud (p. ej. el rollback automático de
        # desplegar-produccion, ensayo 10 de OPS-06). Usa el python3 del runner,
        # que trae PyYAML (como la CI del estándar): sin pip install. Acotado a
        # tests/workflows: los test_ods_*.py de la raíz son scripts que leen un
        # .ods local al importarse y un `discover` en la raíz los ejecutaría.
        if: hashFiles('tests/workflows/test_*.py') != ''
        run: python3 -m unittest discover -s tests/workflows -v

  # ---------------------------------------------------------------------------
  # Fase 2 — seguridad-estatica: reusable OSS (todos los modos).
  # NOTA: en el repositorio del proyecto la ruta es local
  # (./.github/workflows/_reusable-security.yml); bootstrap-repo.sh copia el
  # archivo. se mapean GITLEAKS_LICENSE y SNYK_TOKEN si existen.
  # subir_sarif: solo cuando Code Scanning está disponible (público o GHAS).
  # ---------------------------------------------------------------------------
  seguridad-estatica:
    name: seguridad-estatica
    needs: preparar
    permissions:
      contents: read
      # security-events: write solo lo usa el reusable cuando subir_sarif = true
      # (Code Scanning en Modo A/B). No se concede pull-requests: write (los
      # escáneres no comentan en el PR).
      # pull-requests: read lo pide el job `secretos` del reusable: gitleaks-action lista
      # los commits del PR por la API y, en un repositorio privado, sin él responde 403.
      # Un job llamador no puede conceder menos de lo que el reusable pide.
      pull-requests: read
      security-events: write
      actions: read
    uses: ./.github/workflows/_reusable-security.yml
    with:
      ruta: '.'
      stack: node
      bloquear_en: ${{ vars.BLOQUEAR_EN || 'CRITICAL,HIGH' }}
      subir_sarif: ${{ github.event.repository.visibility == 'public' || vars.GHAS_ENABLED == 'true' }}
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
    # Mínimo privilegio: solo los dos secretos que el reusable declara en
    # `on.workflow_call.secrets` (ambos opcionales). `secrets: inherit`
    # pasaba también los de despliegue, que ningún escáner necesita.
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ---------------------------------------------------------------------------
  # Fase 3 — construir: build de producción (Vite). APP_ENV selecciona el
  # archivo .env.<ambiente> que Vite carga con --mode. El artifact dist/ se
  # reutiliza en staging y producción (se despliega lo que se probó).
  # ---------------------------------------------------------------------------
  construir:
    name: construir
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Se construyen ambos ambientes en paralelo: el de producción solo
        # se usa si el run es de tag/dispatch, pero cuesta ~1 min y simplifica.
        ambiente: [staging, production]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # En workflow_dispatch se analiza/despliega el tag aprobado (D3)
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Habilitar corepack
        if: needs.preparar.outputs.pm != 'npm'
        run: corepack enable

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ needs.preparar.outputs.pm }}

      - name: Instalar dependencias
        run: ${{ needs.preparar.outputs.instalar }}

      - name: Build (${{ matrix.ambiente }})
        env:
          APP_ENV: ${{ matrix.ambiente }}
          VITE_APP_VERSION: ${{ github.ref_name }}-${{ github.sha }}
        run: npm run build -- --mode "$APP_ENV"

      - name: Guardar dist/
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ matrix.ambiente }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Vista previa en PR (opcional, vars.FIREBASE_PREVIEW == 'true'). Solo para
  # PRs del mismo repositorio (nunca de forks: no reciben secretos ni OIDC).
  # Requiere que el proveedor WIF de staging confíe en `pull_request`.
  # ---------------------------------------------------------------------------
  previsualizar:
    name: previsualizar (canal de PR)
    needs: [calidad, construir]
    # `github.actor != 'dependabot[bot]'`: las PR de Dependabot corren con un
    # almacén de secretos APARTE y no reciben los del repositorio, así que la
    # autenticación federada se queda sin `workload_identity_provider` y el job
    # falla siempre («Secret source: Dependabot»). No es un defecto que
    # corregir: es lo que impide que una PR de actualización de dependencias
    # alcance la nube. Concederle esos secretos abriría justo el vector de
    # cadena de suministro que el `cooldown` de dependabot.yml viene a cerrar.
    #
    # La compuerta no se debilita: `compuerta-pr` solo exige `calidad` y
    # `seguridad-estatica`, y ambas corren igual, como Semgrep, Trivy, Gitleaks
    # y CodeQL. Aplique el mismo `if` a cualquier job de PR que use
    # credenciales de nube en los demás pipelines.
    #
    # Dos condiciones, no una: `github.actor` es quien disparó ESTA ejecución y
    # cambia si una persona empuja un commit a la rama de Dependabot (el actor
    # pasa a ser esa persona y el job recibiría los secretos y el OIDC del
    # repositorio sobre código que Dependabot abrió). `pull_request.user.login`
    # es el autor del PR y sigue siendo Dependabot aunque cambie el actor. El
    # job corre solo si ninguno de los dos es Dependabot.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && vars.FIREBASE_PREVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout (firebase.json)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # En workflow_dispatch se analiza/despliega el tag aprobado (D3)
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Descargar dist/
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-staging
          path: dist

      - name: Autenticar en GCP (WIF + impersonación)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_DEPLOY_STAGING }}

      - name: Desplegar canal de vista previa (expira en 7 días)
        id: canal
        env:
          PROYECTO: ${{ vars.GCP_PROJECT_ID_STAGING }}
          CANAL: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          npm i -g "firebase-tools@${FIREBASE_TOOLS_VERSION}"
          rc=0
          firebase hosting:channel:deploy "$CANAL" --project "$PROYECTO" \
            --expires 7d --non-interactive --json 2>/tmp/canal.err | tee canal.json || rc=$?
          if [ "$rc" -ne 0 ] && grep -qiE 'site not found|404.*site|no site (named|with id)' /tmp/canal.err canal.json; then
            echo "::error::El proyecto $PROYECTO no tiene creado el sitio de Hosting, así que no hay dónde publicar la vista previa. Créelo una vez con: firebase hosting:sites:create $PROYECTO --project $PROYECTO"
          fi
          [ "$rc" -eq 0 ] || { cat /tmp/canal.err >&2; exit "$rc"; }
          url=$(jq -r '.result | to_entries[0].value.url' canal.json)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comentar URL en el PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          URL_CANAL: ${{ steps.canal.outputs.url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Vista previa desplegada: ${process.env.URL_CANAL} (expira en 7 días)`
            });

  # ---------------------------------------------------------------------------
  # Fase 4 — desplegar-staging: automático en cada push a main.
  # ---------------------------------------------------------------------------
  desplegar-staging:
    name: desplegar-staging
    needs: [calidad, seguridad-estatica, construir]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # token OIDC para WIF
    steps:
      - name: Checkout (firebase.json, firestore.rules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # En workflow_dispatch se analiza/despliega el tag aprobado (D3)
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Descargar dist/
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-staging
          path: dist

      - name: Autenticar en GCP (WIF + impersonación de la SA de deploy)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_DEPLOY_STAGING }}

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Preparar el gestor de paquetes para el hook `predeploy`
        # `firebase deploy` ejecuta los hooks `predeploy` de firebase.json. En
        # cuanto FIREBASE_DEPLOY_ONLY incluye `functions` —lo normal en un
        # proyecto Firebase— ese hook compila las Functions con el gestor del
        # proyecto, y estos jobs solo preparaban Node:
        #
        #   /bin/sh: 1: pnpm: not found
        #   Error: functions predeploy error: exit code 127
        #
        # Lo grave es CUÁNDO falla: en producción, después de la compuerta de
        # aprobación del Environment. Se aprueba el pase y solo entonces se
        # descubre que el despliegue no puede ni empezar.
        # Detectado en novuchat-site (2026-09-03).
        run: |
          set -euo pipefail
          corepack enable
          # `corepack prepare --activate` aborta con "The local project doesn't
          # feature a 'packageManager' field" cuando el proyecto no declara ese
          # campo, y tumba el despliegue entero aunque no haya hook `predeploy`
          # que preparar. Si no está declarado, alcanza con el gestor que trae
          # Node. Detectado en PRETSO (2026-09-25).
          if grep -q '"packageManager"' package.json 2>/dev/null; then
            corepack prepare --activate
          fi
          # `functions/` suele traer su propio lockfile: no es del workspace.
          if [[ -f functions/package.json ]]; then
            if   [[ -f functions/pnpm-lock.yaml ]];    then pnpm --dir functions install --frozen-lockfile
            elif [[ -f functions/yarn.lock ]];         then (cd functions && yarn install --frozen-lockfile)
            elif [[ -f functions/package-lock.json ]]; then npm ci --prefix functions
            fi
          fi

      - name: Conservar copia de la versión actual (canal "previa" para rollback)
        # D7: antes de CADA deploy a live (staging y producción) se clona el
        # contenido en vivo a un canal "previa". El rollback es clonar de vuelta.
        # AVISO: la llamada REST de renovación (PATCH sobre
        # sites/<sitio>/channels/previa con updateMask=ttl) NO se verificó
        # contra el servicio real de Firebase Hosting: solo con dobles en
        # pruebas-workflows/canal_previa.py. Si falla en el primer uso real, el
        # efecto es únicamente el ::warning:: y el canal conserva su plazo.
        continue-on-error: true
        env:
          PROYECTO: ${{ vars.GCP_PROJECT_ID_STAGING }}
          SITIO: ${{ vars.GCP_PROJECT_ID_STAGING }}
        run: |
          npm i -g "firebase-tools@${FIREBASE_TOOLS_VERSION}"
          firebase hosting:channel:create previa --project "$PROYECTO" --site "$SITIO" --expires 30d \
            --non-interactive >/dev/null 2>&1 || true
          if ! firebase hosting:clone "$SITIO:live" "$SITIO:previa" --project "$PROYECTO"; then
            echo "::notice::No se pudo clonar live a 'previa' (esperable en el primer despliegue, cuando aún no hay versión en live; si no lo es, vea el error de arriba): no hay copia para rollback automático hasta el siguiente despliegue."
            echo "::warning::No se pudo guardar la copia para rollback (clone $SITIO:live → previa). Si el sitio '$SITIO' todavía no existe, créelo: firebase hosting:sites:create $SITIO --project $PROYECTO"
            exit 0
          fi
          # Renueva el plazo del canal: `--expires 30d` solo rige al CREARLO y
          # `hosting:clone` no lo extiende. Sin esto "previa" caduca 30 días
          # después de crearse aunque se clone en cada despliegue. Un fallo
          # aquí NUNCA tumba el despliegue: solo avisa. Sin la cabecera
          # x-goog-user-project a propósito: exige serviceusage.services.use sobre
          # el proyecto y la cuenta de despliegue del estándar no lo tiene; con un
          # token de cuenta de servicio la cuota ya va al proyecto de esa cuenta.
          # Con tiempos máximos: un curl colgado agotaría el timeout del job
          # (continue-on-error no protege de eso).
          token="$(gcloud auth print-access-token 2>/dev/null)" || token=""
          if [[ -z "$token" ]]; then
            echo "::warning::No se pudo obtener el token para renovar el plazo del canal 'previa' (gcloud auth print-access-token); conserva el plazo que tenía."
            exit 0
          fi
          respuesta="$(mktemp)"
          codigo="$(curl -sS --connect-timeout 10 --max-time 30 -o "$respuesta" -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data '{"ttl":"2592000s"}' \
            "https://firebasehosting.googleapis.com/v1beta1/sites/${SITIO}/channels/previa?updateMask=ttl")" || codigo="000"
          # El motivo del fallo (error.message de la respuesta; no contiene el token).
          motivo="$(python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); print(str(d.get("error", {}).get("message", ""))[:200])' "$respuesta" 2>/dev/null)" || motivo=""
          rm -f "$respuesta"
          case "$codigo" in
            2??) echo "Plazo del canal 'previa' renovado a 30 días." ;;
            *)   echo "::warning::No se pudo renovar el plazo del canal 'previa' (HTTP $codigo${motivo:+: $motivo}); conserva el plazo que tenía." ;;
          esac

      - name: Desplegar hosting + reglas (staging)
        env:
          PROYECTO: ${{ vars.GCP_PROJECT_ID_STAGING }}
          SITIO: ${{ vars.GCP_PROJECT_ID_STAGING }}
          SOLO: ${{ vars.FIREBASE_DEPLOY_ONLY || 'hosting,firestore:rules' }}
          URL_STAGING: ${{ vars.STAGING_URL }}
        run: |
          set -euo pipefail
          # `firebase deploy` PUEDE SALIR CON CÓDIGO 0 HABIENDO FALLADO: rotula
          # los fallos de Functions como avisos y continúa, y la versión de
          # hosting se queda en CREATED sin pasar nunca a FINALIZED. En
          # novuchat-site (2026-09-03) este paso dio VERDE con las dos Functions
          # sin desplegar y el sitio en 404, diciendo «Producción desplegada».
          # Lo destapó el health check posterior. Un despliegue que miente es
          # peor que uno que falla: el acta de producción se firma con lo que
          # dice el pipeline.
          rc=0
          firebase deploy --only "$SOLO" --project "$PROYECTO" --non-interactive \
            --message "staging ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})" 2>&1 \
            | tee /tmp/despliegue.log || rc=$?
          # Sitio de Hosting ausente: desde el 15/10/2026 un proyecto nuevo no
          # trae creado el suyo (aviso de Firebase, 28/09/2026) y firebase
          # deploy solo dice «404 Site Not Found». Sin esta traducción, el
          # primer despliegue de un proyecto nuevo es un error opaco.
          if grep -qiE 'site not found|404.*site|no site (named|with id)' /tmp/despliegue.log; then
            echo "::error::El proyecto $PROYECTO no tiene creado el sitio de Hosting '$SITIO'. Créelo una vez con: firebase hosting:sites:create $SITIO --project $PROYECTO (03-scripts/setup-oidc-gcp.sh lo verifica y lo crea al federar). Si el siteId no puede ser el del proyecto, declárelo en firebase.json (\"site\") y, en producción, en la variable FIREBASE_SITE_ID."
            exit 1
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          if grep -qiE 'failed to create function|failed to update function|Build failed with status|Deploy failed|had HTTP Error' /tmp/despliegue.log; then
            echo "::error::firebase deploy terminó con código 0 pero su registro contiene fallos: el despliegue NO está completo."
            exit 1
          fi

          echo "### Staging desplegado: $URL_STAGING" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Fase 5 — dast-y-humo: contra staging recién desplegado.
  # ---------------------------------------------------------------------------
  dast-y-humo:
    name: dast-y-humo
    needs: desplegar-staging
    permissions:
      contents: read
    uses: ./.github/workflows/_reusable-dast.yml
    with:
      url_objetivo: ${{ vars.STAGING_URL }}
      reglas: .github/zap-rules.tsv
      escaneo_completo: false
      ruta_salud: ${{ vars.HEALTH_PATH || '/health' }}

  # ---------------------------------------------------------------------------
  # Fase 6 — desplegar-produccion (D3): push de tag v* estable (nunca
  # prerelease) en Modo A/B, o workflow_dispatch con confirmar=DESPLEGAR
  # (obligatorio en Modo B0, donde no hay Environments con revisores). El step
  # "Verificar aprobación" valida tag, ancestro de main, aprobador y firma.
  # ---------------------------------------------------------------------------
  desplegar-produccion:
    name: desplegar-produccion
    needs: [calidad, seguridad-estatica, construir]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        && !contains(github.ref_name, '-') && vars.MODO != 'B0')
      || (github.event_name == 'workflow_dispatch' && inputs.confirmar == 'DESPLEGAR')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      salud_ok: ${{ steps.salud.outputs.ok }}
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false # nunca interrumpir un despliegue a producción
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # En workflow_dispatch se analiza/despliega el tag aprobado (D3)
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0 # historial y tags completos para verificar la aprobación

      # D3 — Verificación de aprobación previa a producción (todos los modos).
      - name: Verificar aprobación
        env:
          EVENTO: ${{ github.event_name }}
          TAG: ${{ inputs.tag || github.ref_name }}
          ACTOR: ${{ github.actor }}
          APROBADORES: ${{ vars.APROBADORES_PROD }}
          FIRMA_REQUERIDA: ${{ vars.TAG_FIRMADO_REQUERIDO }}
          REF_EJECUCION: ${{ github.ref }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if [[ "$EVENTO" == "workflow_dispatch" ]]; then
            # 0) El dispatch se lanza SOBRE el mismo tag estable que despliega. Control de coherencia del propio
            #    workflow (NO es una barrera: quien edita el workflow en una rama puede quitarlo; la barrera de
            #    identidad es la condición del provider de producción, setup-oidc-gcp.sh 2.3, PR-B, pendiente).
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::El tag del dispatch debe tener la forma vX.Y.Z (versión estable; un prerelease no se despliega a producción)."
              exit 1
            fi
            if [[ "$REF_EJECUCION" != "refs/tags/$TAG" ]]; then
              wf="${GITHUB_WORKFLOW_REF%%@*}"; wf="${wf##*/}"
              echo "::error::Lance el workflow_dispatch sobre el mismo tag que despliega: gh workflow run ${wf} --ref ${TAG} -f tag=${TAG} -f confirmar=DESPLEGAR (ref de esta ejecución: ${REF_EJECUCION})"
              exit 1
            fi
            # 0b) El código descargado es el del tag aprobado, no el de una rama con el mismo nombre.
            [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/tags/$TAG^{commit}")" ]] \
              || { echo "::error::El código del workspace no es el del tag $TAG (¿existe una rama con el mismo nombre?)"; exit 1; }
            # 1) El tag existe
            git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
              || { echo "::error::El tag '$TAG' no existe en el repositorio"; exit 1; }
            # 2) No es prerelease (v1.2.0-rc.1 nunca despliega producción)
            [[ "$TAG" != *-* ]] \
              || { echo "::error::'$TAG' es un prerelease y no despliega producción"; exit 1; }
            # 3) El tag es ancestro de origin/main (código ya integrado)
            git merge-base --is-ancestor "$TAG" origin/main \
              || { echo "::error::'$TAG' no es ancestro de origin/main"; exit 1; }
            # 4) Quien ejecuta está en vars.APROBADORES_PROD (lista separada por comas)
            lista=",$(echo "$APROBADORES" | tr -d ' '),"
            [[ "$lista" == *",$ACTOR,"* ]] \
              || { echo "::error::'$ACTOR' no está en vars.APROBADORES_PROD"; exit 1; }
            # 5) Firma del tag (obligatoria si vars.TAG_FIRMADO_REQUERIDO == 'true')
            if [[ "$FIRMA_REQUERIDA" == "true" ]]; then
              git tag -v "$TAG" \
                || { echo "::error::El tag '$TAG' no tiene firma verificable (TAG_FIRMADO_REQUERIDO=true)"; exit 1; }
            fi
          else
            # push de tag: ancestro de main y no prerelease
            git merge-base --is-ancestor "$TAG" origin/main \
              || { echo "::error::El tag '$TAG' no es ancestro de origin/main"; exit 1; }
            [[ "$TAG" != *-* ]] \
              || { echo "::error::'$TAG' es un prerelease y no despliega producción"; exit 1; }
          fi
          echo "Aprobación verificada: $TAG por $ACTOR ($EVENTO)"

      - name: Descargar dist/
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-production
          path: dist

      - name: Autenticar en GCP (WIF + impersonación, SA de producción)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_DEPLOY_PROD }}

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Preparar el gestor de paquetes para el hook `predeploy`
        # `firebase deploy` ejecuta los hooks `predeploy` de firebase.json. En
        # cuanto FIREBASE_DEPLOY_ONLY incluye `functions` —lo normal en un
        # proyecto Firebase— ese hook compila las Functions con el gestor del
        # proyecto, y estos jobs solo preparaban Node:
        #
        #   /bin/sh: 1: pnpm: not found
        #   Error: functions predeploy error: exit code 127
        #
        # Lo grave es CUÁNDO falla: en producción, después de la compuerta de
        # aprobación del Environment. Se aprueba el pase y solo entonces se
        # descubre que el despliegue no puede ni empezar.
        # Detectado en novuchat-site (2026-09-03).
        run: |
          set -euo pipefail
          corepack enable
          # `corepack prepare --activate` aborta con "The local project doesn't
          # feature a 'packageManager' field" cuando el proyecto no declara ese
          # campo, y tumba el despliegue entero aunque no haya hook `predeploy`
          # que preparar. Si no está declarado, alcanza con el gestor que trae
          # Node. Detectado en PRETSO (2026-09-25).
          if grep -q '"packageManager"' package.json 2>/dev/null; then
            corepack prepare --activate
          fi
          # `functions/` suele traer su propio lockfile: no es del workspace.
          if [[ -f functions/package.json ]]; then
            if   [[ -f functions/pnpm-lock.yaml ]];    then pnpm --dir functions install --frozen-lockfile
            elif [[ -f functions/yarn.lock ]];         then (cd functions && yarn install --frozen-lockfile)
            elif [[ -f functions/package-lock.json ]]; then npm ci --prefix functions
            fi
          fi

      - name: Conservar copia de la versión actual (canal "previa" para rollback)
        # Clona el contenido en vivo a un canal de vista previa de larga
        # duración. Si el health check posterior falla, el paso "Rollback de
        # hosting" de este mismo job lo vuelve a clonar sobre live. Ver 01-seguridad/06-rollback-e-incidentes.md.
        # AVISO: la llamada REST de renovación (PATCH sobre
        # sites/<sitio>/channels/previa con updateMask=ttl) NO se verificó
        # contra el servicio real de Firebase Hosting: solo con dobles en
        # pruebas-workflows/canal_previa.py. Si falla en el primer uso real, el
        # efecto es únicamente el ::warning:: y el canal conserva su plazo.
        continue-on-error: true
        env:
          PROYECTO: ${{ vars.GCP_PROJECT_ID_PROD }}
          SITIO: ${{ vars.FIREBASE_SITE_ID || vars.GCP_PROJECT_ID_PROD }}
        run: |
          npm i -g "firebase-tools@${FIREBASE_TOOLS_VERSION}"
          firebase hosting:channel:create previa --project "$PROYECTO" --site "$SITIO" --expires 30d \
            --non-interactive >/dev/null 2>&1 || true
          if ! firebase hosting:clone "$SITIO:live" "$SITIO:previa" --project "$PROYECTO"; then
            echo "::notice::No se pudo clonar live a 'previa' (esperable en el primer despliegue, cuando aún no hay versión en live; si no lo es, vea el error de arriba): no hay copia para rollback automático hasta el siguiente despliegue."
            echo "::warning::No se pudo guardar la copia para rollback (clone $SITIO:live → previa). Si el sitio '$SITIO' todavía no existe, créelo: firebase hosting:sites:create $SITIO --project $PROYECTO"
            exit 0
          fi
          # Renueva el plazo del canal: `--expires 30d` solo rige al CREARLO y
          # `hosting:clone` no lo extiende. Sin esto "previa" caduca 30 días
          # después de crearse aunque se clone en cada despliegue. Un fallo
          # aquí NUNCA tumba el despliegue: solo avisa. Sin la cabecera
          # x-goog-user-project a propósito: exige serviceusage.services.use sobre
          # el proyecto y la cuenta de despliegue del estándar no lo tiene; con un
          # token de cuenta de servicio la cuota ya va al proyecto de esa cuenta.
          # Con tiempos máximos: un curl colgado agotaría el timeout del job
          # (continue-on-error no protege de eso).
          token="$(gcloud auth print-access-token 2>/dev/null)" || token=""
          if [[ -z "$token" ]]; then
            echo "::warning::No se pudo obtener el token para renovar el plazo del canal 'previa' (gcloud auth print-access-token); conserva el plazo que tenía."
            exit 0
          fi
          respuesta="$(mktemp)"
          codigo="$(curl -sS --connect-timeout 10 --max-time 30 -o "$respuesta" -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data '{"ttl":"2592000s"}' \
            "https://firebasehosting.googleapis.com/v1beta1/sites/${SITIO}/channels/previa?updateMask=ttl")" || codigo="000"
          # El motivo del fallo (error.message de la respuesta; no contiene el token).
          motivo="$(python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); print(str(d.get("error", {}).get("message", ""))[:200])' "$respuesta" 2>/dev/null)" || motivo=""
          rm -f "$respuesta"
          case "$codigo" in
            2??) echo "Plazo del canal 'previa' renovado a 30 días." ;;
            *)   echo "::warning::No se pudo renovar el plazo del canal 'previa' (HTTP $codigo${motivo:+: $motivo}); conserva el plazo que tenía." ;;
          esac

      - name: Desplegar hosting + reglas (producción)
        env:
          PROYECTO: ${{ vars.GCP_PROJECT_ID_PROD }}
          SITIO: ${{ vars.FIREBASE_SITE_ID || vars.GCP_PROJECT_ID_PROD }}
          SOLO: ${{ vars.FIREBASE_DEPLOY_ONLY || 'hosting,firestore:rules' }}
          URL_PROD: ${{ vars.PROD_URL }}
        run: |
          set -euo pipefail
          # `firebase deploy` PUEDE SALIR CON CÓDIGO 0 HABIENDO FALLADO: rotula
          # los fallos de Functions como avisos y continúa, y la versión de
          # hosting se queda en CREATED sin pasar nunca a FINALIZED. En
          # novuchat-site (2026-09-03) este paso dio VERDE con las dos Functions
          # sin desplegar y el sitio en 404, diciendo «Producción desplegada».
          # Lo destapó el health check posterior. Un despliegue que miente es
          # peor que uno que falla: el acta de producción se firma con lo que
          # dice el pipeline.
          rc=0
          firebase deploy --only "$SOLO" --project "$PROYECTO" --non-interactive \
            --message "producción ${GITHUB_REF_NAME} (run ${GITHUB_RUN_ID})" 2>&1 \
            | tee /tmp/despliegue.log || rc=$?
          # Sitio de Hosting ausente: desde el 15/10/2026 un proyecto nuevo no
          # trae creado el suyo (aviso de Firebase, 28/09/2026) y firebase
          # deploy solo dice «404 Site Not Found». Sin esta traducción, el
          # primer despliegue de un proyecto nuevo es un error opaco.
          if grep -qiE 'site not found|404.*site|no site (named|with id)' /tmp/despliegue.log; then
            echo "::error::El proyecto $PROYECTO no tiene creado el sitio de Hosting '$SITIO'. Créelo una vez con: firebase hosting:sites:create $SITIO --project $PROYECTO (03-scripts/setup-oidc-gcp.sh lo verifica y lo crea al federar). Si el siteId no puede ser el del proyecto, declárelo en firebase.json (\"site\") y, en producción, en la variable FIREBASE_SITE_ID."
            exit 1
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          if grep -qiE 'failed to create function|failed to update function|Build failed with status|Deploy failed|had HTTP Error' /tmp/despliegue.log; then
            echo "::error::firebase deploy terminó con código 0 pero su registro contiene fallos: el despliegue NO está completo."
            exit 1
          fi

          echo "### Producción desplegada: $URL_PROD (${GITHUB_REF_NAME})" >> "$GITHUB_STEP_SUMMARY"

      - name: Health check de producción (10 intentos, 15 s)
        id: salud
        env:
          URL: ${{ vars.PROD_URL }}
          RUTA_SALUD: ${{ vars.HEALTH_PATH || '/health' }}
        run: |
          set -uo pipefail
          for i in $(seq 1 10); do
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -L "${URL%/}${RUTA_SALUD}" || echo 000)
            # Una SPA estática puede no exponer /health: 404 en la ruta de salud
            # se acepta si / responde 200.
            if [[ "$codigo" == "404" ]]; then
              codigo=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -L "${URL%/}/" || echo 000)
            fi
            [[ "$codigo" == "200" ]] && { echo "ok=true" >> "$GITHUB_OUTPUT"; echo "OK ($i)"; exit 0; }
            echo "Intento $i: $codigo"; sleep 15
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "::error::Producción no responde 200 tras 10 intentos"

      - name: Rollback de hosting (clonar canal "previa" sobre live)
        if: steps.salud.outputs.ok == 'false'
        env:
          PROYECTO: ${{ vars.GCP_PROJECT_ID_PROD }}
          SITIO: ${{ vars.FIREBASE_SITE_ID || vars.GCP_PROJECT_ID_PROD }}
        run: |
          set -euo pipefail
          npm i -g "firebase-tools@${FIREBASE_TOOLS_VERSION}"
          # Único procedimiento de rollback del estándar (D7): clonar el canal
          # "previa" guardado antes del deploy sobre live. Si el canal no
          # existe, el rollback es MANUAL: consola Firebase → Hosting →
          # Historial de versiones → "Revertir" (ver 06-rollback-e-incidentes.md).
          # Las reglas de Firestore se revierten con `git revert` + nuevo tag.
          # ALCANCE: este paso revierte SOLO Hosting. Las reglas de Firestore,
          # las funciones y los datos NO se revierten solos.
          if firebase hosting:clone "$SITIO:previa" "$SITIO:live" --project "$PROYECTO"; then
            echo "::warning::ROLLBACK ejecutado: live restaurado desde el canal 'previa'. Se revirtió SOLO Hosting: las reglas de Firestore, las funciones y los datos NO se revierten solos; si el despliegue los cambió, use git revert + nuevo tag (ver 01-seguridad/06-rollback-e-incidentes.md)."
          else
            echo "::error::Rollback automático no disponible (y aunque lo estuviera, revertiría SOLO Hosting: reglas de Firestore, funciones y datos no se revierten solos). Ejecute el rollback manual: consola Firebase → Hosting → Historial → Revertir; para reglas y funciones, git revert + nuevo tag. Ver 01-seguridad/06-rollback-e-incidentes.md"
          fi

      - name: Fallar si producción no responde
        if: steps.salud.outputs.ok == 'false'
        run: echo "::error::Health check de producción fallido tras el despliegue; se intentó el rollback (paso anterior)."; exit 1

  # ---------------------------------------------------------------------------
  # Fase 7 — post-despliegue: registra el resultado como Deployment (útil en B0).
  # El health check y el rollback corren al final de desplegar-produccion, el único
  # job aprobado por el Environment (los secretos del Environment solo llegan a los
  # jobs que lo declaran). Cuando exista la condición del provider de producción
  # (03-scripts/setup-oidc-gcp.sh 2.3, PR-B, pendiente), la identidad de producción
  # en GCP solo aceptará tokens de un tag v* estable y, en Modos A/B, de un job con
  # environment: production. Declarar aquí el Environment pediría otra aprobación.
  # Este job no recibe credenciales de nube.
  # ---------------------------------------------------------------------------
  post-despliegue:
    name: post-despliegue
    needs: desplegar-produccion
    if: >-
      always() && contains(fromJSON('["success","failure"]'), needs.desplegar-produccion.result)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Registrar resultado del despliegue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULTADO: ${{ needs.desplegar-produccion.result }}
          SALUD_OK: ${{ needs.desplegar-produccion.outputs.salud_ok }}
          URL_PROD: ${{ vars.PROD_URL }}
        with:
          script: |
            const ok = process.env.RESULTADO === 'success';
            const descripcion = ok
              ? 'Health check correcto'
              : process.env.SALUD_OK === 'false'
                ? 'Health check fallido; rollback intentado en desplegar-produccion'
                : 'desplegar-produccion falló antes de verificar la salud';
            const { data: d } = await github.rest.repos.createDeployment({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: context.ref, environment: 'production', auto_merge: false,
              required_contexts: [], transient_environment: false,
              description: `Verificación post-despliegue ${context.ref}`
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              deployment_id: d.id, state: ok ? 'success' : 'failure',
              environment_url: process.env.URL_PROD,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: descripcion
            });
            core.summary.addHeading('Post-despliegue')
              .addRaw(ok ? 'Producción verificada correctamente.' : `FALLO: ${descripcion}.`)
              .write();
            if (!ok) core.setFailed('Despliegue a producción fallido: vea el job desplegar-produccion');

  # ---------------------------------------------------------------------------
  # compuerta-pr (D1): ÚNICO status check que exigen los rulesets de main.
  # Agrega calidad y seguridad-estatica (con o sin matriz) en un solo contexto
  # estable; falla si cualquiera de sus needs no terminó en success.
  # ---------------------------------------------------------------------------
  compuerta-pr:
    name: compuerta-pr
    needs: [calidad, seguridad-estatica]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar resultados de calidad y seguridad-estatica
        env:
          R_CALIDAD: ${{ needs.calidad.result }}
          R_SEGURIDAD: ${{ needs.seguridad-estatica.result }}
        run: |
          set -euo pipefail
          echo "calidad=$R_CALIDAD | seguridad-estatica=$R_SEGURIDAD"
          for r in "$R_CALIDAD" "$R_SEGURIDAD"; do
            if [[ "$r" != "success" ]]; then
              echo "::error::compuerta-pr bloqueada: algún job requerido no terminó en success"
              exit 1
            fi
          done
          echo "compuerta-pr: aprobada"
