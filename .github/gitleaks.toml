# =============================================================================
# gitleaks.toml — Configuración de Gitleaks para _reusable-security.yml,
#                 pre-commit y security-local.sh
# Versión: 2.2 | Fecha: 2026-10-01 | Destino: .github/gitleaks.toml
# PRETSO: segunda exención de generic-api-key (apiKey web de Firebase), al final.
# -----------------------------------------------------------------------------
# Extiende la configuración por defecto de Gitleaks (≈170 reglas: AWS, GCP,
# GitHub, Slack, claves privadas, JWT, etc.) y añade:
#   - Reglas propias para credenciales de OCI y GCP que el default no cubre
#     bien (config de OCI con fingerprint + OCID, JSON de service account).
#   - Allowlist de rutas de pruebas/fixtures/artefactos (con cuidado:
#     un secreto real en un fixture sigue siendo un secreto; la allowlist solo
#     evita falsos positivos de datos claramente sintéticos).
#   - La documentación (docs/**/*.md) SÍ se analiza. Hasta la 2.1 estaba excluida
#     entera y era un punto ciego: en proyectos cuyos informes operativos viven en
#     docs/, una credencial pegada ahí no la veía ninguna regla (medido el 2026-10-01:
#     una clave con formato AWS en docs/*.md pasaba limpia). Solo la regla genérica
#     `generic-api-key` queda eximida en .md de docs/ (ver el final del archivo),
#     porque ahí marca identificadores y tokens de ejemplo de las respuestas de API.
# Sintaxis de [[allowlists]] (global y por regla). La versión de Gitleaks está fijada y es la
# misma en CI (_reusable-security.yml), security-local.sh y pre-commit: la 8.24.3, que era la
# de la acción en CI, ignora la sección global [[allowlists]] (medido); la 8.28.0 y la 8.30.1
# la aplican. Verificar con:
#   gitleaks detect --config .github/gitleaks.toml --redact -v
# =============================================================================
title = "Estándar DevSecOps — Gitleaks"

[extend]
useDefault = true
# Para desactivar reglas del default con justificación (ID exacto):
# disabledRules = ["generic-api-key"]

# -----------------------------------------------------------------------------
# Reglas propias
# -----------------------------------------------------------------------------

[[rules]]
id = "oci-api-key-config"
description = "Bloque de configuración de OCI (~/.oci/config) con fingerprint y OCIDs"
regex = '''(?i)fingerprint\s*=\s*([0-9a-f]{2}:){15}[0-9a-f]{2}'''
keywords = ["fingerprint"]
tags = ["oci", "config"]

[[rules]]
id = "oci-ocid-user-or-tenancy"
description = "OCID de usuario/tenancy fuera de IaC (suele acompañar a una API key en archivos de config)"
regex = '''ocid1\.(user|tenancy)\.oc1\.\.[a-z0-9]{40,}'''
keywords = ["ocid1.user", "ocid1.tenancy"]
tags = ["oci", "identificador"]
# Los OCID por sí solos no son secretos, pero en un ~/.oci/config o .env
# copiado al repo delatan una credencial completa. Se permiten en IaC y en
# el manifiesto, donde son referencias legítimas.
[[rules.allowlists]]
paths = ['''(^|/)infra/.*\.tf$''', '''\.tfvars(\.example)?$''', '''(^|/)\.devsecops\.yml$''']

[[rules]]
id = "oci-auth-token"
description = "Auth token de OCI (usado para OCIR/Docker login)"
regex = '''(?i)(oci[_-]?auth[_-]?token|OCIR_TOKEN)\s*[:=]\s*['"]?[A-Za-z0-9#$%&()*+,\-.:;<=>?@\[\]^_{|}~]{20,}['"]?'''
keywords = ["oci_auth_token", "OCIR_TOKEN", "oci-auth-token"]
tags = ["oci", "token"]

[[rules]]
id = "gcp-service-account-json"
description = "JSON de service account de GCP (type service_account + private_key_id)"
regex = '''"type"\s*:\s*"service_account"'''
keywords = ["service_account"]
tags = ["gcp", "credencial"]
# El estándar prohíbe JSON de SA en repositorios: siempre WIF.

[[rules]]
id = "gcp-api-key"
description = "Clave de API de Google (AIza...) fuera de archivos de configuración pública de Firebase"
regex = '''AIza[0-9A-Za-z\-_]{35}'''
keywords = ["AIza"]
tags = ["gcp", "api-key"]
[[rules.allowlists]]
# Las API keys web de Firebase son públicas por diseño (se protegen con App
# Check y restricciones de referer); se permiten solo en estos archivos.
paths = ['''(^|/)firebase(-config)?\.(js|ts|json)$''', '''(^|/)\.env\.(staging|production)\.example$''']

[[rules]]
id = "firebase-token-ci"
description = "FIREBASE_TOKEN de `firebase login:ci` (deprecado y prohibido por el estándar)"
regex = '''1//0[A-Za-z0-9_\-]{40,}'''
keywords = ["1//0"]
tags = ["firebase", "token"]

# -----------------------------------------------------------------------------
# Allowlist global (aplica a todas las reglas)
# -----------------------------------------------------------------------------
[[allowlists]]
description = "Rutas de pruebas, fixtures y artefactos generados"
paths = [
  '''(^|/)(test|tests|__tests__|spec|fixtures|__fixtures__|mocks|__mocks__)/''',
  '''\.(test|spec)\.(js|jsx|ts|tsx|py)$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)yarn\.lock$''',
  '''(^|/)poetry\.lock$''',
  '''(^|/)uv\.lock$''',
  '''(^|/)go\.sum$''',
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)coverage/''',
  '''\.min\.(js|css)$''',
  '''\.(png|jpg|jpeg|gif|svg|ico|woff2?|ttf|pdf)$''',
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)\.github/gitleaks\.toml$''',
  # Artefactos que generan las propias herramientas del estándar. Todos están en
  # .gitignore (security-local.sh y bootstrap-repo.sh los agregan), así que no hay
  # código del proyecto ahí; pero Gitleaks en modo directorio (--no-git) no respeta
  # .gitignore y en la SEGUNDA corrida de security-local.sh leía la base de Trivy
  # (.trivy-cache/db/trivy.db) y daba ~20 CRITICAL falsos. Son directorios exactos
  # y anclados a la raíz (donde escriben security-local.sh y deploy.sh): un
  # `src/trivy-cache.js` o un `functions/.trivy-cache/` se siguen analizando.
  '''^\.trivy-cache/''',
  '''^\.security-reports/''',
  '''^\.deploy-log/''',
]

[[allowlists]]
description = "Valores claramente sintéticos usados en ejemplos y plantillas"
regexes = [
  '''(?i)(ejemplo|example|dummy|placeholder|changeme|xxxxxxxx|REEMPLAZAR|<[A-Z_]+>)''',
  '''AKIAIOSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
]
stopwords = ["ejemplo", "example", "placeholder", "sample"]

# -----------------------------------------------------------------------------
# Documentación: se analiza con todas las reglas de proveedor (AWS, GitHub, claves
# privadas, JWT, las propias de OCI y GCP…). Solo se exime `generic-api-key`, la regla
# por entropía y nombre de variable, y solo en los .md de docs/ de la raíz (no en
# doc/ ni en <componente>/docs/), porque ahí marca los ids y tokens de
# EJEMPLO de las respuestas de API (caso real: un id de muestra en el contrato de
# ManejoQRSimple, 2026-10-01). En código y en cualquier otra ruta sigue activa.
# Qué se pierde: un token pegado en un .md sin formato de proveedor reconocible. Para
# repositorios con informes operativos en docs/, revisarlos al publicarlos o quitar esta
# exención en su copia.
#
# PRETSO (2026-09-30, aprobado por Andres Alberdi): la misma regla tiene un segundo
# permitido, la apiKey web de Firebase en la configuración por ambiente. La regla
# propia gcp-api-key ya la permite en archivos firebase.ts (arriba), pero la regla
# genérica del conjunto por defecto también la marca. La apiKey web es pública por
# diseño (la protegen las reglas de Firestore y su restricción por referente y por
# API), así que se permite a esa regla, y solo en esos archivos: cualquier otra ruta
# con una clave sigue marcada.
#
# UN SOLO bloque `[[rules]] id = "generic-api-key"` con las dos exenciones: si hubiera
# dos bloques con el mismo id, Gitleaks se queda con el último y la otra exención se
# pierde sin aviso. Al actualizar este archivo desde el estándar, fusione aquí.
# -----------------------------------------------------------------------------
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Ids y tokens de ejemplo en la documentación"
paths = ['''^docs/.*\.md$''']

[[rules.allowlists]]
description = "apiKey web de Firebase en src/environments/<ambiente>/firebase.ts (PRETSO)"
paths = ['''(^|/)src/environments/[^/]+/firebase\.ts$''']
